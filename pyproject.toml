[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "focus_binary_benchmark"
version = "1.0.0"
description = "Imbalance-aware binary autofocus benchmark for smear-related microscopy."
authors = [{name = "Dineth Hewavitharana"}]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "pillow>=10.0",
    "tensorflow>=2.12",
    "keras-tuner>=1.4",
    "tensorflow-addons>=0.21",
    "tqdm>=4.65",
]

[project.optional-dependencies]
vision = [
    "opencv-python-headless>=4.8",
    "albumentations>=1.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["focus_binary*", "focus_binary.scripts*"]

[tool.setuptools.package-data]
"focus_binary" = ["../configs/*.yaml"]
